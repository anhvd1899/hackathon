<!DOCTYPE html>
<html>
<head>
    <title>Chainlit Test</title>
</head>
<body style="margin:0;padding:0;font-family:Arial;">
    <div style="padding:20px;background:#1a1a1a;color:white;">
        <h2>🧪 Chainlit Integration Test</h2>
        <p>Testing iframe integration with Chainlit...</p>
        <button onclick="loadChainlit()" style="padding:10px 20px;background:#007cba;color:white;border:none;cursor:pointer;">
            Load Chainlit
        </button>
        <div id="status" style="margin:10px 0;padding:10px;background:#333;"></div>
    </div>
    
    <iframe 
        id="chainlit-frame"
        src="about:blank" 
        style="width:100%;height:600px;border:1px solid #333;">
    </iframe>

    <script>
        function loadChainlit() {
            const iframe = document.getElementById('chainlit-frame');
            const status = document.getElementById('status');
            
            status.innerHTML = '🔄 Loading Chainlit...';
            console.log('Loading Chainlit iframe');
            
            iframe.src = '/chat/';
            
            iframe.onload = function() {
                status.innerHTML = '✅ Chainlit loaded successfully!';
                status.style.background = '#0d5016';
                console.log('Chainlit iframe loaded');
            };
            
            iframe.onerror = function() {
                status.innerHTML = '❌ Failed to load Chainlit';
                status.style.background = '#5d1a1a';
                console.error('Chainlit iframe failed');
            };
        }
        
        // Auto load after 2 seconds
        setTimeout(loadChainlit, 2000);
    </script>
</body>
</html>
