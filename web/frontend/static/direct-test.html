<!DOCTYPE html>
<html>
<head>
    <title>Chainlit Direct Test</title>
    <style>
        body { margin:0; padding:20px; background:#1a1a1a; color:white; font-family:Arial; }
        iframe { width:100%; height:600px; border:2px solid #00ff88; margin:10px 0; }
        .status { padding:10px; margin:10px 0; background:#333; border-radius:5px; }
    </style>
</head>
<body>
    <h1>🧪 Chainlit Direct Integration Test</h1>
    
    <div class="status">
        <strong>Status:</strong> <span id="status">Loading Chainlit...</span>
    </div>
    
    <div class="status">
        <strong>Server:</strong> <span id="server-status">Checking...</span>
    </div>
    
    <iframe id="chainlit" src="/chat/" title="Chainlit Chat"></iframe>

    <script>
        const iframe = document.getElementById('chainlit');
        const status = document.getElementById('status');
        const serverStatus = document.getElementById('server-status');
        
        // Test server first
        fetch('/chat/')
            .then(response => {
                if (response.ok) {
                    serverStatus.textContent = '✅ Server responding (200 OK)';
                    serverStatus.style.color = '#00ff88';
                } else {
                    serverStatus.textContent = `❌ Server error (${response.status})`;
                    serverStatus.style.color = '#ff4444';
                }
            })
            .catch(err => {
                serverStatus.textContent = '❌ Server unreachable';
                serverStatus.style.color = '#ff4444';
            });
        
        // Monitor iframe
        iframe.onload = function() {
            status.textContent = '✅ Chainlit loaded successfully!';
            status.style.color = '#00ff88';
            console.log('Chainlit iframe loaded successfully');
        };
        
        iframe.onerror = function() {
            status.textContent = '❌ Chainlit failed to load';
            status.style.color = '#ff4444';
            console.error('Chainlit iframe error');
        };
        
        // Timeout fallback
        setTimeout(() => {
            if (status.textContent === 'Loading Chainlit...') {
                status.textContent = '⏱️ Chainlit taking longer than expected...';
                status.style.color = '#ffaa00';
            }
        }, 5000);
    </script>
</body>
</html>
