# Profile dbt-duckdb tro vao CUNG file warehouse ma Python dang dung.
#
# Duong dan lay tu bien moi truong DRA_DUCKDB_PATH (xem config.py). Khong hardcode de
# chay duoc ca o local, trong Docker, va trong CI.
#
# LUU Y QUAN TRONG: DuckDB chi cho 1 tien trinh GHI vao file cung luc. Khi web server
# dang chay, dung goi `dbt` truc tiep tu terminal — hay dung
# `POST /api/dbt/run` hoac `python -m data.jobs.run_dbt`, cac duong nay tu dong
# dong connection dung chung truoc khi goi dbt (xem data/dbt_runner.py).
data_reliability:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DRA_DUCKDB_PATH', '../warehouse.duckdb') }}"
      schema: main
      threads: 1
