<!DOCTYPE html>
<html>
<head>
    <title>Test Tab Switching</title>
    <style>
        .tab { padding: 10px; border: 1px solid #ccc; margin: 5px; cursor: pointer; }
        .active { background: #007cba; color: white; }
        .inactive { background: #f0f0f0; }
        .content { padding: 20px; border: 1px solid #ccc; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Tab Switch Test</h1>
    
    <div>
        <button id="tab-matrix-btn" class="tab active" onclick="switchRightPanelTab('matrix')">📋 Matrix</button>
        <button id="tab-chat-btn" class="tab inactive" onclick="switchRightPanelTab('chat')">💬 Chat</button>
    </div>
    
    <div id="tab-matrix" class="content" style="display:block;">
        <h3>Matrix Content</h3>
        <p>This is the matrix tab content</p>
    </div>
    
    <div id="tab-chat" class="content" style="display:none;">
        <h3>Chat Content</h3>
        <iframe 
            id="chainlit-iframe" 
            src="about:blank" 
            data-src="http://localhost:8000/chat/"
            style="width:100%; height:400px; border:1px solid #ccc;"
        ></iframe>
    </div>

    <script>
        function $id(id) { return document.getElementById(id); }
        
        function switchRightPanelTab(tabName) {
            console.log(`🔄 Switching right panel to: ${tabName}`);
            
            const matrixBtn = $id('tab-matrix-btn');
            const chatBtn = $id('tab-chat-btn');
            const matrixTab = $id('tab-matrix');
            const chatTab = $id('tab-chat');
            
            if (tabName === 'matrix') {
                matrixBtn.className = 'tab active';
                chatBtn.className = 'tab inactive';
                matrixTab.style.display = 'block';
                chatTab.style.display = 'none';
            } else if (tabName === 'chat') {
                matrixBtn.className = 'tab inactive';
                chatBtn.className = 'tab active';
                matrixTab.style.display = 'none';
                chatTab.style.display = 'block';
                
                // Load iframe
                const iframe = $id('chainlit-iframe');
                if (iframe && !iframe.dataset.loaded) {
                    iframe.dataset.loaded = '1';
                    iframe.src = iframe.dataset.src || 'http://localhost:8000/chat/';
                    console.log(`✅ Iframe src set to: ${iframe.src}`);
                }
            }
        }
    </script>
</body>
</html>
